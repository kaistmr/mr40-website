# Supabase 무료 플랜은 7일간 활동이 없으면 프로젝트를 일시정지한다(주소록·근황 폼 먹통).
# 3일마다 directory 함수에 ping을 보내 DB를 한 번 읽어 활동을 유지한다. 비밀 불필요.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping directory function
        run: |
          code=$(curl -s -o /tmp/out -w "%{http_code}" -X POST \
            https://upbvxipashgyowctbhby.supabase.co/functions/v1/directory \
            -H "Content-Type: application/json" -d '{"ping":true}')
          echo "HTTP $code $(cat /tmp/out)"
          test "$code" = "200"
