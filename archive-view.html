<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="옛 MR 홈페이지를 그때 그대로 보는 타임머신 화면" /><title>옛 홈페이지 보기 — MR 40</title>
  <link rel="icon" href="assets/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
  <link rel="stylesheet" href="assets/style.css" />
  <script src="config.js"></script><script src="assets/common.js"></script><script src="assets/i18n.js"></script>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; }
    .tv-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding: .6rem .9rem;
      background: #0e1838; border-bottom: 1px solid rgba(91,140,255,.3); }
    .tv-logo { color: var(--text); font-size: 1.15rem; text-decoration: none; padding-right: .9rem;
      margin-right: .9rem; border-right: 1px solid rgba(125,141,181,.3); }
    .tv-logo span { color: var(--accent); }
    .tv-year { font-weight: 800; font-size: 1.05rem; margin-right: auto; }
    .tv-year small { display: block; font-weight: 500; font-size: .8rem; color: var(--muted); }
    .tv-bar a:not(.tv-logo), .tv-bar button { display: inline-flex; align-items: center; gap: .35rem; min-height: 44px;
      padding: .5rem 1rem; border-radius: 9999px; border: 1px solid var(--accent); background: none;
      color: var(--accent); font-family: inherit; font-size: .95rem; font-weight: 700; cursor: pointer; }
    .tv-bar a.home { background: var(--accent); color: #0b1020; border-color: var(--accent); }
    .tv-bar button[hidden] { display: none; }   /* class 규칙이 [hidden]을 덮어써서 명시 */
    .tv-bar button[aria-pressed="true"] { background: rgba(91,140,255,.2); }
    .tv-frame { width: 100%; height: calc(100% - 3.6rem); border: 0; background: #fff; }
    .tv-hint { display: none; padding: .5rem .9rem; font-size: .85rem; color: var(--muted); background: #0b1430; }
    /* 이 화면에서는 당시 배경음악을 틀므로 사이트 주제가 버튼은 감춘다 */
    .music-fab { display: none !important; }
    .tv-bar .new-window-note { display: none; }
    @media (max-width: 700px) {
      .tv-logo { border-right: 0; padding-right: 0; margin-right: auto; }
      .tv-year { width: 100%; margin-right: 0; margin-top: .3rem; }
      .tv-bar a:not(.tv-logo), .tv-bar button { flex: 1 1 auto; justify-content: center; }
      .tv-hint { display: block; }
      .tv-frame { height: calc(100% - 8.4rem); }
    }
  </style>
</head>
<body>
  <div class="tv-bar">
    <a class="logo tv-logo" href="index.html" aria-label="MR40 처음으로"><img class="logo-mark" src="assets/logos/mr_logo_2026.png" alt="" />MR<span>40</span></a>
    <div class="tv-year" id="tv-year">옛 홈페이지<small>그때 그 화면 그대로입니다</small></div>
    <a class="home" href="archive.html">← 목록으로</a>
    <button type="button" id="tv-bgm" aria-pressed="false" hidden>♪ 배경음악 켜기</button>
    <a id="tv-raw" href="archive.html" target="_blank" rel="noopener">새 창에서 크게 보기</a>
  </div>
  <p class="tv-hint">옛 홈페이지는 큰 화면(1024px) 기준으로 만들어져, 휴대폰에서는 좌우로 밀어서 보셔야 합니다.</p>
  <iframe class="tv-frame" id="tv-frame" title="옛 홈페이지"></iframe>

  <script>
  (function () {
    "use strict";
    var SITES = {
      "2001": { src: "archive/2001/index.htm",    label: "2001년 홈페이지" },
      "2002": { src: "archive/2002/main.htm",     label: "2002년 홈페이지", bgm: "archive/2002/music/MR_bysemi.mid" },
      "2005": { src: "archive/2005/index.html",   label: "2005년 홈페이지" },
      "2007": { src: "archive/2007/index.html",   label: "2007년 홈페이지" },
      "2008": { src: "archive/2008/MR/index.htm", label: "2008년 홈페이지", bgm: "archive/2008/MR/music/MR_bysemi.mid" },
      "2009": { src: "archive/2009/2009MR.htm",   label: "2009년 홈페이지" }
    };
    var year = new URLSearchParams(location.search).get("y");
    var site = SITES[year];
    if (!site) { location.replace("archive.html"); return; }

    document.getElementById("tv-year").innerHTML =
      escapeHtml(site.label) + "<small>그때 그 화면 그대로입니다</small>";
    document.getElementById("tv-frame").src = site.src;
    document.getElementById("tv-raw").href = site.src;

    // ── 당시 배경음악 되살리기 ──
    // 원본은 IE 전용 <bgsound>로 MIDI를 틀었다. 요즘 브라우저는 둘 다 못 해서,
    // JZZ의 작은 신시사이저로 같은 .mid 파일을 연주한다. (자동재생은 막혀 있어 버튼으로)
    var btn = document.getElementById("tv-bgm");
    if (!site.bgm) return;
    btn.hidden = false;
    var player = null, loading = false;

    function load(srcs, done) {
      var next = srcs.shift();
      if (!next) return done();
      var el = document.createElement("script");
      el.src = next;
      el.onload = function () { load(srcs, done); };
      el.onerror = function () { done(new Error("load failed")); };
      document.head.appendChild(el);
    }

    function start() {
      btn.textContent = "♪ 준비 중…";
      load([
        "https://cdn.jsdelivr.net/npm/jzz@1.9.4/javascript/JZZ.min.js",
        "https://cdn.jsdelivr.net/npm/jzz-midi-smf@1.9.4/javascript/JZZ.midi.SMF.min.js",
        "https://cdn.jsdelivr.net/npm/jzz-synth-tiny@1.3.4/javascript/JZZ.synth.Tiny.min.js"
      ], function (err) {
        if (err || !window.JZZ) return fail();
        fetch(site.bgm).then(function (r) { return r.arrayBuffer(); }).then(function (buf) {
          JZZ.synth.Tiny.register("Web Audio");
          player = JZZ.MIDI.SMF(new Uint8Array(buf)).player();
          player.connect(JZZ().openMidiOut());
          player.loop(true);
          player.play();
          btn.textContent = "♪ 배경음악 끄기";
          btn.setAttribute("aria-pressed", "true");
        }).catch(fail);
      });
    }

    function fail() {
      player = null;
      btn.textContent = "♪ 배경음악을 재생할 수 없습니다";
      btn.disabled = true;
    }

    btn.addEventListener("click", function () {
      if (loading) return;
      if (player) {
        player.stop();
        player = null;
        btn.textContent = "♪ 배경음악 켜기";
        btn.setAttribute("aria-pressed", "false");
        return;
      }
      loading = true;
      start();
      setTimeout(function () { loading = false; }, 800);
    });
  })();
  </script>
</body>
</html>
