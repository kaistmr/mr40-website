name: update-members

on:
  schedule:
    # 매일 18:00 UTC = 03:00 KST
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-members
  cancel-in-progress: false

jobs:
  update-members:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build members.enc
        env:
          GSA_CLIENT_EMAIL: ${{ secrets.GSA_CLIENT_EMAIL }}
          GSA_PRIVATE_KEY: ${{ secrets.GSA_PRIVATE_KEY }}
          MEMBERS_CODE: ${{ secrets.MEMBERS_CODE }}
          MEMBERS_SHEET_ID: ${{ vars.MEMBERS_SHEET_ID }}
          RESPONSES_SHEET_ID: ${{ vars.RESPONSES_SHEET_ID }}
          MEMBERS_SHEET_RANGE: ${{ vars.MEMBERS_SHEET_RANGE }}
          RESPONSES_SHEET_RANGE: ${{ vars.RESPONSES_SHEET_RANGE }}
        run: node scripts/build-members-enc.mjs

      - name: Commit and push if changed
        run: |
          git add data/members.enc
          git diff --cached --quiet || (git -c user.name="mr40-bot" -c user.email="actions@github.com" commit -m "chore(members): 주소록 자동 갱신" && git push)
